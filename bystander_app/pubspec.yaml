name: uyirkappan_bystander
description: "UyirKappan Module 1 - Bystander Mobile Application for Real-Time Emergency Response."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.5.1
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
