<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="uyirkappan_bystander">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UyirKappan - Emergency Response</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS v5 for OpenFreeMap Integration -->
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="maplibre_bridge.js?v=20260905_3"></script>

  <style>
    /* Custom MapLibre Markers for UyirKappan */
    .uk-incident-marker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    .uk-incident-callout {
      background: #D32F2F;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.45);
      border: 1.5px solid #FFFFFF;
      white-space: nowrap;
      margin-bottom: 6px;
      animation: uk-bounce 2s infinite ease-in-out;
    }
    @keyframes uk-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .uk-pin-container {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .uk-pin-dot {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #EF4444 40%, #B91C1C 100%);
      border: 3.5px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.9), 0 2px 8px rgba(0, 0, 0, 0.4);
      z-index: 2;
    }
    .uk-pulse-ring {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.4);
      animation: uk-pulse 1.8s infinite ease-out;
      z-index: 1;
    }
    @keyframes uk-pulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Hospital Markers */
    .uk-hospital-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 5;
    }
    .uk-hospital-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #FFFFFF;
      color: #1E293B;
      border: 1.5px solid #DC2626;
      border-radius: 12px;
      padding: 3px 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .uk-hospital-icon {
      font-size: 14px;
    }
    .uk-hospital-name {
      font-size: 11px;
      font-weight: 800;
      color: #0F172A;
    }
    .uk-hospital-dist {
      font-size: 10px;
      font-weight: 700;
      color: #DC2626;
      background: #FEE2E2;
      padding: 1px 4px;
      border-radius: 4px;
    }
    .uk-hospital-pin {
      width: 10px;
      height: 10px;
      background: #DC2626;
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Standby Ambulances */
    .uk-standby-ambulance-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 6;
    }
    .uk-standby-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid #10B981;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .uk-pulse-dot-green {
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10B981;
      animation: uk-pulse-green 1.5s infinite;
    }
    @keyframes uk-pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .uk-standby-icon {
      font-size: 20px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    /* Active Dispatched Ambulance */
    .uk-ambulance-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 12;
    }
    .uk-ambulance-bubble {
      background: #DC2626;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1.5px solid #FFFFFF;
      box-shadow: 0 3px 8px rgba(220, 38, 38, 0.4);
      white-space: nowrap;
      margin-bottom: 2px;
    }
    .uk-ambulance-icon {
      font-size: 28px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
      transition: transform 0.3s ease;
    }

    /* Map Tooltip Popups */
    .maplibregl-popup-content {
      padding: 10px 14px !important;
      border-radius: 14px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    .uk-map-popup h4 {
      margin: 0 0 4px 0;
      font-size: 13px;
      font-weight: 800;
      color: #0F172A;
    }
    .uk-popup-type {
      margin: 0 0 4px 0;
      font-size: 11px;
      font-weight: 700;
      color: #DC2626;
    }
    .uk-popup-info {
      margin: 0 0 2px 0;
      font-size: 11px;
      color: #334155;
    }
    .uk-popup-address {
      margin: 0;
      font-size: 10px;
      color: #64748B;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
